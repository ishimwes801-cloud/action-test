name: generate files
on:
  pull_request: {}
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: write-permission test (expect 403 for fork PRs)
        run: |
          curl -s -o /dev/null -w "Issue-create API status: %{http_code}\n" \
            -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/issues \
            -d '{"title":"token write test"}'
      - name: generate
        run: make generate
